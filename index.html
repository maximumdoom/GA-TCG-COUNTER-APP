<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#020617">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="GA Counter">
    <title>GA TCG Counter</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            -webkit-user-select: none;
            overflow: hidden;
        }
        .font-cinzel {
            font-family: 'Cinzel', serif;
        }
        .btn-press:active {
            transform: scale(0.93);
        }
        .rotate-opponent {
            transform: rotate(180deg);
        }
        @keyframes modalPop {
            0% { opacity: 0; transform: scale(0.95); }
            100% { opacity: 1; transform: scale(1); }
        }
        .animate-pop {
            animation: modalPop 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        @keyframes sequencePop {
            0% { opacity: 0; transform: scale(0.6) translateY(10px); }
            50% { transform: scale(1.1) translateY(0); }
            100% { opacity: 1; transform: scale(1) translateY(0); }
        }
        .animate-seq {
            animation: sequencePop 0.2s ease-out forwards;
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 h-screen w-screen flex flex-col justify-between overflow-hidden select-none">

    <!-- TOP PLAYER (CYAN / SAPPHIRE THEME - MIRRORED) -->
    <section class="flex-1 rotate-opponent bg-gradient-to-b from-cyan-950/80 to-slate-950/90 border-b border-cyan-500/20 p-4 flex flex-col justify-between relative overflow-hidden">
        <div class="flex justify-between items-center z-10">
            <span class="text-[11px] font-bold text-cyan-400 uppercase tracking-widest bg-cyan-950/60 px-3 py-1 rounded-full border border-cyan-800/50">
                Dano
            </span>
            <span class="text-xs font-semibold text-cyan-500/80 bg-slate-950/80 px-2.5 py-1 rounded-full border border-cyan-900/40">
                / 25
            </span>
        </div>

        <div class="flex-1 flex flex-col items-center justify-center my-1 z-10 relative">
            <div id="p2SequenceBadge" class="hidden absolute -top-2 px-3 py-1 rounded-full text-sm font-black tracking-wider shadow-lg animate-seq border">
                +0
            </div>
            
            <div id="p2Damage" class="text-8xl font-black text-cyan-400 drop-shadow-[0_0_25px_rgba(34,211,238,0.4)] transition-all duration-200 tracking-tight">
                0
            </div>
            
            <div class="w-full max-w-xs bg-slate-950/80 h-2.5 rounded-full mt-3 overflow-hidden border border-cyan-900/50 p-0.5">
                <div id="p2Bar" class="bg-gradient-to-r from-cyan-500 to-teal-400 h-full rounded-full transition-all duration-300 w-0"></div>
            </div>
        </div>

        <div class="grid grid-cols-4 gap-2.5 z-10 max-w-md mx-auto w-full">
            <button onclick="adjustDamage(2, -5)" class="btn-press bg-cyan-950/40 hover:bg-cyan-900/50 text-cyan-300 font-bold text-sm py-3.5 rounded-2xl border border-cyan-800/40 shadow">
                −5
            </button>
            <button onclick="adjustDamage(2, -1)" class="btn-press bg-cyan-950/40 hover:bg-cyan-900/50 text-cyan-300 font-bold text-2xl py-3.5 rounded-2xl border border-cyan-800/40 shadow">
                −
            </button>
            <button onclick="adjustDamage(2, 1)" class="btn-press bg-cyan-900/60 hover:bg-cyan-800/60 text-cyan-200 font-bold text-2xl py-3.5 rounded-2xl border border-cyan-600/50 shadow">
                +
            </button>
            <button onclick="adjustDamage(2, 5)" class="btn-press bg-cyan-900/60 hover:bg-cyan-800/60 text-cyan-200 font-bold text-sm py-3.5 rounded-2xl border border-cyan-600/50 shadow">
                +5
            </button>
        </div>
    </section>

    <!-- MIDDLE UTILITY BAR -->
    <div class="bg-slate-950 py-2 px-3 flex items-center justify-between border-y border-slate-800/80 z-20 gap-2">
        <div class="flex items-center gap-2">
            <div id="logoContainer" class="w-8 h-8 rounded-lg bg-slate-900 border border-slate-700/80 flex items-center justify-center overflow-hidden p-0.5">
                <img id="appLogo" src="logo.png" alt="GA Logo" class="w-full h-full object-contain" onerror="this.onerror=null; this.classList.add('hidden'); document.getElementById('logoFallbackIcon').classList.remove('hidden');" />
                <svg id="logoFallbackIcon" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-amber-400 hidden" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" />
                </svg>
            </div>
            <span class="font-cinzel text-xs font-bold tracking-widest text-slate-300 hidden sm:inline">GA TCG</span>
        </div>

        <div class="flex items-center gap-2">
            <button onclick="downloadSelf()" title="Baixar App" class="btn-press bg-slate-900 hover:bg-slate-800 border border-slate-700/80 text-cyan-400 font-semibold text-xs px-3 py-2 rounded-xl flex items-center gap-1.5 shadow">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-3.5 w-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
                </svg>
                <span>Baixar</span>
            </button>

            <button onclick="resetGame()" class="btn-press bg-slate-900 hover:bg-slate-800 border border-slate-700/80 text-slate-200 font-semibold text-xs tracking-wider uppercase px-3.5 py-2 rounded-xl flex items-center gap-1.5 shadow">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-3.5 w-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
                </svg>
                <span>Reiniciar</span>
            </button>
        </div>
    </div>

    <!-- BOTTOM PLAYER (CRIMSON / AMBER THEME) -->
    <section class="flex-1 bg-gradient-to-b from-slate-950/90 to-rose-950/80 border-t border-rose-500/20 p-4 flex flex-col justify-between relative overflow-hidden">
        <div class="flex justify-between items-center z-10">
            <span class="text-[11px] font-bold text-rose-400 uppercase tracking-widest bg-rose-950/60 px-3 py-1 rounded-full border border-rose-800/50">
                Dano
            </span>
            <span class="text-xs font-semibold text-rose-500/80 bg-slate-950/80 px-2.5 py-1 rounded-full border border-rose-900/40">
                / 25
            </span>
        </div>

        <div class="flex-1 flex flex-col items-center justify-center my-1 z-10 relative">
            <div id="p1SequenceBadge" class="hidden absolute -top-2 px-3 py-1 rounded-full text-sm font-black tracking-wider shadow-lg animate-seq border">
                +0
            </div>

            <div id="p1Damage" class="text-8xl font-black text-rose-400 drop-shadow-[0_0_25px_rgba(244,63,94,0.4)] transition-all duration-200 tracking-tight">
                0
            </div>
            
            <div class="w-full max-w-xs bg-slate-950/80 h-2.5 rounded-full mt-3 overflow-hidden border border-rose-900/50 p-0.5">
                <div id="p1Bar" class="bg-gradient-to-r from-rose-500 to-amber-500 h-full rounded-full transition-all duration-300 w-0"></div>
            </div>
        </div>

        <div class="grid grid-cols-4 gap-2.5 z-10 max-w-md mx-auto w-full">
            <button onclick="adjustDamage(1, -5)" class="btn-press bg-rose-950/40 hover:bg-rose-900/50 text-rose-300 font-bold text-sm py-3.5 rounded-2xl border border-rose-800/40 shadow">
                −5
            </button>
            <button onclick="adjustDamage(1, -1)" class="btn-press bg-rose-950/40 hover:bg-rose-900/50 text-rose-300 font-bold text-2xl py-3.5 rounded-2xl border border-rose-800/40 shadow">
                −
            </button>
            <button onclick="adjustDamage(1, 1)" class="btn-press bg-rose-900/60 hover:bg-rose-800/60 text-rose-200 font-bold text-2xl py-3.5 rounded-2xl border border-rose-600/50 shadow">
                +
            </button>
            <button onclick="adjustDamage(1, 5)" class="btn-press bg-rose-900/60 hover:bg-rose-800/60 text-rose-200 font-bold text-sm py-3.5 rounded-2xl border border-rose-600/50 shadow">
                +5
            </button>
        </div>
    </section>

    <!-- DUAL-ORIENTED WIN/LOSS MODAL OVERLAY -->
    <div id="gameOverModal" class="hidden fixed inset-0 bg-slate-950/90 backdrop-blur-md z-50 flex flex-col justify-between p-6 animate-pop">
        <div class="rotate-opponent w-full max-w-sm mx-auto">
            <div id="topResultCard" class="border rounded-2xl p-5 text-center shadow-xl">
                <p id="topResultStatus" class="text-xs uppercase tracking-widest font-semibold mb-1"></p>
                <p id="topResultTitle" class="text-3xl font-black font-cinzel"></p>
            </div>
        </div>

        <div class="my-auto text-center">
            <button onclick="resetGame()" class="btn-press bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-600 hover:to-amber-700 text-slate-950 font-black text-sm px-8 py-4 rounded-2xl shadow-xl uppercase tracking-wider transition-all">
                Nova Partida
            </button>
        </div>

        <div class="w-full max-w-sm mx-auto">
            <div id="bottomResultCard" class="border rounded-2xl p-5 text-center shadow-xl">
                <p id="bottomResultStatus" class="text-xs uppercase tracking-widest font-semibold mb-1"></p>
                <p id="bottomResultTitle" class="text-3xl font-black font-cinzel"></p>
            </div>
        </div>
    </div>

    <script>
        const MAX_DAMAGE = 25;
        const MIN_DAMAGE = 0;

        let p1Damage = parseInt(localStorage.getItem('ga_p1Damage')) || 0;
        let p2Damage = parseInt(localStorage.getItem('ga_p2Damage')) || 0;

        let p1SeqDelta = 0;
        let p2SeqDelta = 0;
        let p1SeqTimer = null;
        let p2SeqTimer = null;

        const p1DamageEl = document.getElementById('p1Damage');
        const p2DamageEl = document.getElementById('p2Damage');
        const p1BarEl = document.getElementById('p1Bar');
        const p2BarEl = document.getElementById('p2Bar');
        const p1BadgeEl = document.getElementById('p1SequenceBadge');
        const p2BadgeEl = document.getElementById('p2SequenceBadge');
        const gameOverModal = document.getElementById('gameOverModal');

        function updateUI() {
            p1DamageEl.textContent = p1Damage;
            p2DamageEl.textContent = p2Damage;

            p1BarEl.style.width = `${(p1Damage / MAX_DAMAGE) * 100}%`;
            p2BarEl.style.width = `${(p2Damage / MAX_DAMAGE) * 100}%`;

            localStorage.setItem('ga_p1Damage', p1Damage);
            localStorage.setItem('ga_p2Damage', p2Damage);

            if (p1Damage >= MAX_DAMAGE || p2Damage >= MAX_DAMAGE) {
                triggerGameOver();
            }
        }

        function adjustDamage(player, amount) {
            if (player === 1) {
                const previous = p1Damage;
                p1Damage = Math.max(MIN_DAMAGE, Math.min(MAX_DAMAGE, p1Damage + amount));
                const actualChange = p1Damage - previous;
                if (actualChange !== 0) handleSequenceModifier(1, actualChange);
            } else {
                const previous = p2Damage;
                p2Damage = Math.max(MIN_DAMAGE, Math.min(MAX_DAMAGE, p2Damage + amount));
                const actualChange = p2Damage - previous;
                if (actualChange !== 0) handleSequenceModifier(2, actualChange);
            }
            updateUI();
        }

        function handleSequenceModifier(player, change) {
            if (player === 1) {
                p1SeqDelta += change;
                clearTimeout(p1SeqTimer);
                showBadge(p1BadgeEl, p1SeqDelta, 'rose');
                p1SeqTimer = setTimeout(() => {
                    hideBadge(p1BadgeEl);
                    p1SeqDelta = 0;
                }, 1500);
            } else {
                p2SeqDelta += change;
                clearTimeout(p2SeqTimer);
                showBadge(p2BadgeEl, p2SeqDelta, 'cyan');
                p2SeqTimer = setTimeout(() => {
                    hideBadge(p2BadgeEl);
                    p2SeqDelta = 0;
                }, 1500);
            }
        }

        function showBadge(badgeEl, value, theme) {
            const text = value > 0 ? `+${value}` : `${value}`;
            badgeEl.textContent = text;
            badgeEl.classList.remove('hidden');

            const baseClass = "absolute -top-2 px-3 py-1 rounded-full text-sm font-black tracking-wider shadow-lg animate-seq border ";
            if (theme === 'cyan') {
                badgeEl.className = baseClass + (value > 0 ? "bg-cyan-950 border-cyan-500 text-cyan-300" : "bg-slate-900 border-slate-600 text-slate-300");
            } else {
                badgeEl.className = baseClass + (value > 0 ? "bg-rose-950 border-rose-500 text-rose-300" : "bg-slate-900 border-slate-600 text-slate-300");
            }
        }

        function hideBadge(badgeEl) {
            badgeEl.classList.add('hidden');
        }

        function triggerGameOver() {
            const topCard = document.getElementById('topResultCard');
            const topStatus = document.getElementById('topResultStatus');
            const topTitle = document.getElementById('topResultTitle');

            const bottomCard = document.getElementById('bottomResultCard');
            const bottomStatus = document.getElementById('bottomResultStatus');
            const bottomTitle = document.getElementById('bottomResultTitle');

            if (p1Damage >= MAX_DAMAGE && p2Damage >= MAX_DAMAGE) {
                setResult(topCard, topStatus, topTitle, 'EMPATE', 'FIM DE JOGO', 'amber');
                setResult(bottomCard, bottomStatus, bottomTitle, 'EMPATE', 'FIM DE JOGO', 'amber');
            } else if (p1Damage >= MAX_DAMAGE) {
                setResult(bottomCard, bottomStatus, bottomTitle, 'DERROTA', 'PERDEU', 'rose');
                setResult(topCard, topStatus, topTitle, 'VITÓRIA', 'GANHOU', 'emerald');
            } else {
                setResult(topCard, topStatus, topTitle, 'DERROTA', 'PERDEU', 'rose');
                setResult(bottomCard, bottomStatus, bottomTitle, 'VITÓRIA', 'GANHOU', 'emerald');
            }

            gameOverModal.classList.remove('hidden');
        }

        function setResult(card, statusEl, titleEl, statusText, titleText, theme) {
            if (theme === 'emerald') {
                card.className = "bg-emerald-950/80 border-emerald-500/80 text-emerald-200 border rounded-2xl p-5 text-center shadow-xl backdrop-blur-md";
                statusEl.className = "text-xs uppercase tracking-widest font-semibold mb-1 text-emerald-400";
            } else if (theme === 'rose') {
                card.className = "bg-rose-950/80 border-rose-500/80 text-rose-200 border rounded-2xl p-5 text-center shadow-xl backdrop-blur-md";
                statusEl.className = "text-xs uppercase tracking-widest font-semibold mb-1 text-rose-400";
            } else {
                card.className = "bg-amber-950/80 border-amber-500/80 text-amber-200 border rounded-2xl p-5 text-center shadow-xl backdrop-blur-md";
                statusEl.className = "text-xs uppercase tracking-widest font-semibold mb-1 text-amber-400";
            }

            statusEl.textContent = statusText;
            titleEl.textContent = titleText;
        }

        function resetGame() {
            p1Damage = 0;
            p2Damage = 0;
            p1SeqDelta = 0;
            p2SeqDelta = 0;
            clearTimeout(p1SeqTimer);
            clearTimeout(p2SeqTimer);
            hideBadge(p1BadgeEl);
            hideBadge(p2BadgeEl);
            gameOverModal.classList.add('hidden');
            updateUI();
        }

        function downloadSelf() {
            const htmlContent = "<!DOCTYPE html>\n" + document.documentElement.outerHTML;
            const blob = new Blob([htmlContent], { type: 'text/html' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'ga-tcg-counter.html';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        document.addEventListener('touchend', function (event) {
            const now = (new Date()).getTime();
            if (now - (window.lastTouchEnd || 0) <= 300) {
                event.preventDefault();
            }
            window.lastTouchEnd = now;
        }, false);

        window.onload = function() {
            updateUI();
        };
    </script>
</body>
</html>
