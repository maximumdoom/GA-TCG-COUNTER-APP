<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#020617">
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="GA Counter">
    <meta name="mobile-web-app-capable" content="yes">
    <title>GA TCG Counter</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&family=MedievalSharp&family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
            touch-action: manipulation;
        }
        html, body {
            width: 100vw;
            height: 100dvh;
            margin: 0;
            padding: 0;
            background-color: #020617;
            color: #f8fafc;
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            -webkit-user-select: none;
            overflow: hidden;
            padding-top: env(safe-area-inset-top, 0px);
            padding-bottom: env(safe-area-inset-bottom, 0px);
            padding-left: env(safe-area-inset-left, 0px);
            padding-right: env(safe-area-inset-right, 0px);
        }
        .font-cinzel {
            font-family: 'Cinzel', serif;
        }
        .font-medieval {
            font-family: 'MedievalSharp', cursive;
        }
        .btn-press:active {
            transform: scale(0.93);
        }
        @keyframes modalPop {
            0% { opacity: 0; transform: scale(0.95); }
            100% { opacity: 1; transform: scale(1); }
        }
        .animate-pop {
            animation: modalPop 0.22s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        @keyframes sequencePop {
            0% { opacity: 0; transform: scale(0.6) translateY(10px); }
            50% { transform: scale(1.1) translateY(0); }
            100% { opacity: 1; transform: scale(1) translateY(0); }
        }
        .animate-seq {
            animation: sequencePop 0.2s ease-out forwards;
        }
        @keyframes toastFade {
            0% { opacity: 0; transform: translateY(-10px); }
            15% { opacity: 1; transform: translateY(0); }
            85% { opacity: 1; transform: translateY(0); }
            100% { opacity: 0; transform: translateY(-10px); }
        }
        .animate-toast {
            animation: toastFade 3.5s ease-in-out forwards;
        }
        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { 
            -webkit-appearance: none;
            margin: 0;
        }
        input[type=number] {
            appearance: textfield;
        }
    </style>
</head>
<body class="h-[100dvh] w-full flex flex-col justify-between overflow-hidden select-none bg-slate-950 text-slate-100">

    <div id="toastContainer" class="fixed top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 z-50 pointer-events-none w-11/12 max-w-md"></div>

                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0Z" />
                    </svg>

            </div>
        </div>

    <div class="bg-slate-950 py-1.5 px-3 flex items-center justify-between border-y border-slate-800/80 z-20 gap-2 shrink-0">

        <div class="flex items-center gap-1.5 absolute left-1/2 -translate-x-1/2">

    </div>

                    <!-- Player 1 Config Panel -->
                    <div id="p1ConfigSection" class="bg-slate-950/80 p-3.5 rounded-2xl border flex flex-col gap-2.5">
                        <div class="flex justify-between items-center border-b border-slate-800/80 pb-2">

            p2Theme = p1Theme === 'cyan' ? 'rose' : 'cyan';
        }

        let p1MaxDamage = parseInt(localStorage.getItem('ga_p1Max')) || 25;
        let p2MaxDamage = parseInt(localStorage.getItem('ga_p2Max')) || 25;

        let p1Damage = parseInt(localStorage.getItem('ga_p1Damage')) || 0;
        let p2Damage = parseInt(localStorage.getItem('ga_p2Damage')) || 0;

        let p1SeqDelta = 0;
        let p2SeqDelta = 0;
        let p1SeqTimer = null;
        let p2SeqTimer = null;

        const p1DamageEl = document.getElementById('p1Damage');
        const p2DamageEl = document.getElementById('p2Damage');
        const p1MaxDisplay = document.getElementById('p1MaxDisplay');
        const p2MaxDisplay = document.getElementById('p2MaxDisplay');
        const p1BarEl = document.getElementById('p1Bar');
        const p2BarEl = document.getElementById('p2Bar');
        const p1BadgeEl = document.getElementById('p1SequenceBadge');
        const p2BadgeEl = document.getElementById('p2SequenceBadge');
        const gameOverModal = document.getElementById('gameOverModal');
        const configModal = document.getElementById('configModal');
        const configModalWrapper = document.getElementById('configModalWrapper');

        const p1CustomInput = document.getElementById('p1CustomInput');
        const p2CustomInput = document.getElementById('p2CustomInput');
        const p1ModalValDisplay = document.getElementById('p1ModalValDisplay');
        const p2ModalValDisplay = document.getElementById('p2ModalValDisplay');

        function showToast(message) {
            const container = document.getElementById('toastContainer');
            if (!container) return;
            const toast = document.createElement('div');
            toast.className = 'bg-slate-900/95 border border-amber-500/80 text-amber-200 text-xs text-center px-4 py-2.5 rounded-2xl shadow-2xl backdrop-blur-md font-semibold mb-2 animate-toast';
            toast.textContent = message;
            container.appendChild(toast);
            setTimeout(() => {
                if (toast.parentNode) toast.parentNode.removeChild(toast);
            }, 3600);
        }

        function hideBadge(badgeEl) {
            if (!badgeEl) return;
            badgeEl.classList.add('hidden');
        }

        function showBadge(badgeEl, delta, theme) {
            if (!badgeEl) return;
            badgeEl.textContent = (delta > 0 ? '+' : '') + delta;
            badgeEl.className = 'absolute top-0 px-3 py-0.5 rounded-full text-xs font-black tracking-wider shadow-lg animate-seq border ' + (theme === 'emerald' ? 'bg-emerald-950/90 text-emerald-300 border-emerald-500/80' : 'bg-rose-950/90 text-rose-300 border-rose-500/80');
            badgeEl.classList.remove('hidden');
        }

        function adjustDamage(player, amount) {
            if (player === 1) {
                p1Damage = Math.max(MIN_DAMAGE, Math.min(p1MaxDamage, p1Damage + amount));
                p1SeqDelta += amount;
                showBadge(p1BadgeEl, p1SeqDelta, p1Theme);
                clearTimeout(p1SeqTimer);
                p1SeqTimer = setTimeout(() => { p1SeqDelta = 0; hideBadge(p1BadgeEl); }, 1400);
            } else {
                p2Damage = Math.max(MIN_DAMAGE, Math.min(p2MaxDamage, p2Damage + amount));
                p2SeqDelta += amount;
                showBadge(p2BadgeEl, p2SeqDelta, p2Theme);
                clearTimeout(p2SeqTimer);
                p2SeqTimer = setTimeout(() => { p2SeqDelta = 0; hideBadge(p2BadgeEl); }, 1400);
            }

            updateUI();

            if (p1Damage >= p1MaxDamage || p2Damage >= p2MaxDamage) {
                triggerGameOver();
            }
        }

        function updateUI() {
            if (p1DamageEl) p1DamageEl.textContent = p1Damage;
            if (p2DamageEl) p2DamageEl.textContent = p2Damage;
            if (p1MaxDisplay) p1MaxDisplay.textContent = p1MaxDamage;
            if (p2MaxDisplay) p2MaxDisplay.textContent = p2MaxDamage;

            const p1Pct = p1MaxDamage > 0 ? Math.min(100, (p1Damage / p1MaxDamage) * 100) : 0;
            const p2Pct = p2MaxDamage > 0 ? Math.min(100, (p2Damage / p2MaxDamage) * 100) : 0;

            if (p1BarEl) p1BarEl.style.width = p1Pct + '%';
            if (p2BarEl) p2BarEl.style.width = p2Pct + '%';

            localStorage.setItem('ga_p1Damage', p1Damage);
            localStorage.setItem('ga_p2Damage', p2Damage);
            localStorage.setItem('ga_p1Max', p1MaxDamage);
            localStorage.setItem('ga_p2Max', p2MaxDamage);
            localStorage.setItem('ga_p1Theme', p1Theme);
            localStorage.setItem('ga_p2Theme', p2Theme);
        }

        function setTheme(player, themeKey) {
            if (player === 1 && themeKey === p2Theme) {
                showToast("Esta cor já está em uso pelo Player 2!");
                return;
            }
            if (player === 2 && themeKey === p1Theme) {
                showToast("Esta cor já está em uso pelo Player 1!");
                return;
            }

            if (player === 1) {
                p1Theme = themeKey;
            } else {
                p2Theme = themeKey;
            }
            applyThemeStyles();
            updateUI();
        }

        function setThemeDirect(player, themeKey) {
            setTheme(player, themeKey);
            updateThemeSelectorsUI();
            showToast("Cor alterada com sucesso!");
        }

        function updateThemeSelectorsUI() {
            Object.keys(THEMES).forEach(k => {
                const b1 = document.getElementById(`p1Theme_${k}`);
                const b2 = document.getElementById(`p2Theme_${k}`);
                
                if (b1) {
                    let isDisabled = (k === p2Theme);
                    b1.style.opacity = isDisabled ? "0.3" : "1";
                    b1.style.pointerEvents = isDisabled ? "none" : "auto";
                    b1.style.transform = (k === p1Theme) ? "scale(1.1)" : "scale(1)";
                    b1.style.borderColor = (k === p1Theme) ? "#ffffff" : "#0f172a";
                }
                
                if (b2) {
                    let isDisabled = (k === p1Theme);
                    b2.style.opacity = isDisabled ? "0.3" : "1";
                    b2.style.pointerEvents = isDisabled ? "none" : "auto";
                    b2.style.transform = (k === p2Theme) ? "scale(1.1)" : "scale(1)";
                    b2.style.borderColor = (k === p2Theme) ? "#ffffff" : "#0f172a";
                }
            });
        }

        function toggleFullscreen() {
            try {
                const isFS = !!(document.fullscreenElement || document.webkitFullscreenElement);
                if (!isFS) {
                    const docEl = document.documentElement;
                    if (docEl.requestFullscreen) docEl.requestFullscreen();
                    else if (docEl.webkitRequestFullscreen) docEl.webkitRequestFullscreen();
                } else {
                    if (document.exitFullscreen) document.exitFullscreen();
                    else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
                }
            } catch (err) {
                console.warn("Fullscreen toggle error:", err);
            }
        }

        function updateFullscreenIcons() {
            const isFS = !!(document.fullscreenElement || document.webkitFullscreenElement);
            const fsExpand = document.getElementById('fsIconExpand');
            const fsCompress = document.getElementById('fsIconCompress');
            if (fsExpand) fsExpand.classList.toggle('hidden', isFS);
            if (fsCompress) fsCompress.classList.toggle('hidden', !isFS);
        }

        document.addEventListener('fullscreenchange', updateFullscreenIcons);
        document.addEventListener('webkitfullscreenchange', updateFullscreenIcons);

        function applyThemeStyles() {
            const t1 = THEMES[p1Theme] || THEMES.rose;
            const t2 = THEMES[p2Theme] || THEMES.cyan;

            const p1Section = document.getElementById('p1Section');
            if (p1Section) p1Section.className = `flex-1 min-h-0 bg-gradient-to-b ${t1.bg} p-2 sm:p-3 flex flex-col justify-between relative overflow-hidden transition-colors duration-300`;
            
            const p1Tag = document.getElementById('p1Tag');
            if (p1Tag) p1Tag.className = `text-[10px] sm:text-[11px] font-bold uppercase tracking-widest px-2.5 py-1 rounded-full border transition-all ${t1.tagBg}`;
            
            const p1ConfigBtn = document.getElementById('p1ConfigBtn');
            if (p1ConfigBtn) p1ConfigBtn.className = `btn-press text-[10px] sm:text-[11px] font-semibold px-3 py-1 rounded-full border flex items-center gap-1.5 shadow transition ${t1.btnBg}`;
            
            if (p1DamageEl) p1DamageEl.className = `text-5xl sm:text-7xl font-black transition-all duration-200 tracking-tight leading-none ${t1.text}`;
            
            const p1BarContainer = document.getElementById('p1BarContainer');
            if (p1BarContainer) p1BarContainer.className = `w-full max-w-[200px] sm:max-w-xs bg-slate-950/80 h-1.5 sm:h-2 rounded-full mt-1.5 overflow-hidden border p-0.5 transition-all ${t1.barBorder}`;
            
            if (p1BarEl) p1BarEl.className = `bg-gradient-to-r ${t1.bar} h-full rounded-full transition-all duration-300 w-0`;

            ['p1BtnMinus5', 'p1BtnMinus1', 'p1BtnPlus1', 'p1BtnPlus5'].forEach((id, idx) => {
                const el = document.getElementById(id);
                if (el) el.className = `btn-press font-bold text-xs sm:text-sm py-2 sm:py-2.5 rounded-xl border shadow transition ` + (idx < 2 ? t1.btnMinus : t1.btnPlus);
            });

            const p1ConfigSection = document.getElementById('p1ConfigSection');
            if (p1ConfigSection) p1ConfigSection.className = `bg-slate-950/80 p-3.5 rounded-2xl border ${t1.modalBorder} flex flex-col gap-2.5`;
            const p1ModalDot = document.getElementById('p1ModalDot');
            if (p1ModalDot) p1ModalDot.className = `w-2.5 h-2.5 rounded-full ${t1.dotBg}`;
            if (p1ModalValDisplay) p1ModalValDisplay.className = t1.textSub;
            if (p1CustomInput) p1CustomInput.className = `bg-slate-950 border ${t1.inputBorder} ${t1.textLight} font-bold text-center text-sm py-1 px-2.5 rounded-lg w-20 focus:outline-none`;

            [0, 1, 2, 3, 4].forEach(lvl => {
                const btn = document.getElementById(`p1Lvl${lvl}`);
                if (btn) btn.className = `btn-press text-[10px] font-semibold py-1.5 rounded-lg border transition ${t1.presetBtn}`;
            });

            const p2Section = document.getElementById('p2Section');
            if (p2Section) p2Section.className = `flex-1 min-h-0 rotate-180 bg-gradient-to-b ${t2.bg} p-2 sm:p-3 flex flex-col justify-between relative overflow-hidden transition-colors duration-300`;
            
            const p2Tag = document.getElementById('p2Tag');
            if (p2Tag) p2Tag.className = `text-[10px] sm:text-[11px] font-bold uppercase tracking-widest px-2.5 py-1 rounded-full border transition-all ${t2.tagBg}`;
            
            const p2ConfigBtn = document.getElementById('p2ConfigBtn');
            if (p2ConfigBtn) p2ConfigBtn.className = `btn-press text-[10px] sm:text-[11px] font-semibold px-3 py-1 rounded-full border flex items-center gap-1.5 shadow transition ${t2.btnBg}`;
            
            if (p2DamageEl) p2DamageEl.className = `text-5xl sm:text-7xl font-black transition-all duration-200 tracking-tight leading-none ${t2.text}`;
            
            const p2BarContainer = document.getElementById('p2BarContainer');
            if (p2BarContainer) p2BarContainer.className = `w-full max-w-[200px] sm:max-w-xs bg-slate-950/80 h-1.5 sm:h-2 rounded-full mt-1.5 overflow-hidden border p-0.5 transition-all ${t2.barBorder}`;
            
            if (p2BarEl) p2BarEl.className = `bg-gradient-to-r ${t2.bar} h-full rounded-full transition-all duration-300 w-0`;

            ['p2BtnMinus5', 'p2BtnMinus1', 'p2BtnPlus1', 'p2BtnPlus5'].forEach((id, idx) => {
                const el = document.getElementById(id);
                if (el) el.className = `btn-press font-bold text-xs sm:text-sm py-2 sm:py-2.5 rounded-xl border shadow transition ` + (idx < 2 ? t2.btnMinus : t2.btnPlus);
            });

            const p2ConfigSection = document.getElementById('p2ConfigSection');
            // Keep rotate-180 when inside general modal view so Player 2 can read their settings correctly
            if (p2ConfigSection && !p2ConfigSection.classList.contains('rotate-180')) {
                p2ConfigSection.className = `bg-slate-950/80 p-3.5 rounded-2xl border ${t2.modalBorder} flex flex-col gap-2.5 rotate-180`;
            } else if (p2ConfigSection && p2ConfigSection.classList.contains('rotate-180')) {
                p2ConfigSection.className = `bg-slate-950/80 p-3.5 rounded-2xl border ${t2.modalBorder} flex flex-col gap-2.5 rotate-180`;
            }
            
            const p2ModalDot = document.getElementById('p2ModalDot');
            if (p2ModalDot) p2ModalDot.className = `w-2.5 h-2.5 rounded-full ${t2.dotBg}`;
            if (p2ModalValDisplay) p2ModalValDisplay.className = t2.textSub;
            if (p2CustomInput) p2CustomInput.className = `bg-slate-950 border ${t2.inputBorder} ${t2.textLight} font-bold text-center text-sm py-1 px-2.5 rounded-lg w-20 focus:outline-none`;

            [0, 1, 2, 3, 4].forEach(lvl => {
                const btn = document.getElementById(`p2Lvl${lvl}`);
                if (btn) btn.className = `btn-press text-[10px] font-semibold py-1.5 rounded-lg border transition ${t2.presetBtn}`;
            });

            updateThemeSelectorsUI();
        }

        function openConfigModal(targetPlayer = 0) {
            if (p1CustomInput) p1CustomInput.value = p1MaxDamage;
            if (p2CustomInput) p2CustomInput.value = p2MaxDamage;
            if (p1ModalValDisplay) p1ModalValDisplay.textContent = p1MaxDamage;
            if (p2ModalValDisplay) p2ModalValDisplay.textContent = p2MaxDamage;

            const p1Sec = document.getElementById('p1ConfigSection');
            const p2Sec = document.getElementById('p2ConfigSection');
            const globalBtn = document.getElementById('globalApplyContainer');
            const modalTitle = document.getElementById('modalTitle');
            const modalGrid = document.getElementById('modalContentGrid');

            if (!p1Sec || !p2Sec) return;

            if (targetPlayer === 1) {
                p1Sec.classList.remove('hidden');
                p2Sec.classList.add('hidden');
                if (globalBtn) globalBtn.classList.add('hidden');
                if (modalGrid) modalGrid.className = "grid grid-cols-1 gap-3.5 max-w-sm mx-auto w-full";
                if (modalTitle) modalTitle.textContent = "Configurar Player 1";
                if (configModalWrapper) configModalWrapper.className = "w-full max-w-lg flex items-center justify-center transition-transform duration-300 rotate-0";
            } else if (targetPlayer === 2) {
                p1Sec.classList.add('hidden');
                p2Sec.classList.remove('hidden');
                p2Sec.className = "bg-slate-950/80 p-3.5 rounded-2xl border flex flex-col gap-2.5 rotate-0"; // Normal upright when viewed individually by P2
                if (globalBtn) globalBtn.classList.add('hidden');
                if (modalGrid) modalGrid.className = "grid grid-cols-1 gap-3.5 max-w-sm mx-auto w-full";
                if (modalTitle) modalTitle.textContent = "Configurar Player 2";
                if (configModalWrapper) configModalWrapper.className = "w-full max-w-lg flex items-center justify-center transition-transform duration-300 rotate-180";
            } else {
                p1Sec.classList.remove('hidden');
                p2Sec.classList.remove('hidden');
                p2Sec.className = "bg-slate-950/80 p-3.5 rounded-2xl border flex flex-col gap-2.5 rotate-180"; // Rotated 180deg when in general view so P2 can read it
                if (globalBtn) globalBtn.classList.remove('hidden');
                if (modalGrid) modalGrid.className = "grid grid-cols-1 md:grid-cols-2 gap-3.5";
                if (modalTitle) modalTitle.textContent = "Configurar Partida";
                if (configModalWrapper) configModalWrapper.className = "w-full max-w-lg flex items-center justify-center transition-transform duration-300 rotate-0";
            }

            updateThemeSelectorsUI();
            if (configModal) configModal.classList.remove('hidden');
        }

        function closeConfigModal() {
            if (configModal) configModal.classList.add('hidden');
            applyThemeStyles();
        }

        function setPreset(player, val) {
            if (player === 1) {
                if (p1CustomInput) p1CustomInput.value = val;
                if (p1ModalValDisplay) p1ModalValDisplay.textContent = val;
                p1MaxDamage = val;
            } else {
                if (p2CustomInput) p2CustomInput.value = val;
                if (p2ModalValDisplay) p2ModalValDisplay.textContent = val;
                p2MaxDamage = val;
            }
            updateUI();
        }

        if (p1CustomInput) {
            p1CustomInput.addEventListener('input', (e) => {
                const val = parseInt(e.target.value);
                if (p1ModalValDisplay) p1ModalValDisplay.textContent = e.target.value || '?';
                if (val && val > 0) { p1MaxDamage = val; updateUI(); }
            });
        }
        if (p2CustomInput) {
            p2CustomInput.addEventListener('input', (e) => {
                const val = parseInt(e.target.value);
                if (p2ModalValDisplay) p2ModalValDisplay.textContent = e.target.value || '?';
                if (val && val > 0) { p2MaxDamage = val; updateUI(); }
            });
        }

        function saveAndApplyConfig() {
            const val1 = p1CustomInput ? parseInt(p1CustomInput.value) : p1MaxDamage;
            const val2 = p2CustomInput ? parseInt(p2CustomInput.value) : p2MaxDamage;
            if (val1 && val1 > 0) p1MaxDamage = val1;
            if (val2 && val2 > 0) p2MaxDamage = val2;

            if (p1Damage > p1MaxDamage) p1Damage = p1MaxDamage;
            if (p2Damage > p2MaxDamage) p2Damage = p2MaxDamage;

            closeConfigModal();
            updateUI();
        }

        function triggerGameOver() {
            const topCard = document.getElementById('topResultCard');
            const topStatus = document.getElementById('topResultStatus');
            const topTitle = document.getElementById('topResultTitle');
            const bottomCard = document.getElementById('bottomResultCard');
            const bottomStatus = document.getElementById('bottomResultStatus');
            const bottomTitle = document.getElementById('bottomResultTitle');

            if (!topCard || !bottomCard) return;

            if (p1Damage >= p1MaxDamage && p2Damage >= p2MaxDamage) {
                setResult(topCard, topStatus, topTitle, "EMPATE", "FIM DE JOGO", 'amber');
                setResult(bottomCard, bottomStatus, bottomTitle, "EMPATE", "FIM DE JOGO", 'amber');
            } else if (p1Damage >= p1MaxDamage) {
                setResult(bottomCard, bottomStatus, bottomTitle, "DERROTA", "PERDEU", 'rose');
                setResult(topCard, topStatus, topTitle, "VITÓRIA", "GANHOU", 'emerald');
            } else {
                setResult(topCard, topStatus, topTitle, "DERROTA", "PERDEU", 'rose');
                setResult(bottomCard, bottomStatus, bottomTitle, "VITÓRIA", "GANHOU", 'emerald');
            }

            if (gameOverModal) gameOverModal.classList.add('flex');
            if (gameOverModal) gameOverModal.classList.remove('hidden');
        }

        function setResult(card, statusEl, titleEl, statusText, titleText, theme) {
            if (!card || !statusEl || !titleEl) return;
            card.className = (theme === 'emerald' ? "bg-emerald-950/90 border-emerald-500/80 text-emerald-200" : theme === 'rose' ? "bg-rose-950/90 border-rose-500/80 text-rose-200" : "bg-amber-950/90 border-amber-500/80 text-amber-200") + " border rounded-2xl p-4 text-center shadow-xl backdrop-blur-md";
            statusEl.className = "text-xs uppercase tracking-widest font-semibold mb-1 " + (theme === 'emerald' ? "text-emerald-400" : theme === 'rose' ? "text-rose-400" : "text-amber-400");
            statusEl.textContent = statusText;
            titleEl.textContent = titleText;
        }

        function resetGame() {
            p1Damage = 0;
            p2Damage = 0;
            p1SeqDelta = 0;
            p2SeqDelta = 0;
            clearTimeout(p1SeqTimer);
            clearTimeout(p2SeqTimer);
            hideBadge(p1BadgeEl);
            hideBadge(p2BadgeEl);
            if (gameOverModal) gameOverModal.classList.add('hidden');
            if (gameOverModal) gameOverModal.classList.remove('flex');
            openConfigModal(0);
            updateUI();
        }

        document.addEventListener('touchend', function (event) {
            const now = (new Date()).getTime();
            if (now - (window.lastTouchEnd || 0) <= 300) event.preventDefault();
            window.lastTouchEnd = now;
        }, false);

        window.onload = function() {
            applyThemeStyles();
            updateUI();
        };
    </script>
</body>
</html>
