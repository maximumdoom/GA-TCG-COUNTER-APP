<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>GA TCG Counter</title>
  
  <!-- Configurações PWA e Web App -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0d0e12">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="GA Counter">
  <link rel="apple-touch-icon" href="logo.png">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #0d0e12;
      color: #ffffff;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Estutura de Tela Dividida */
    .player-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 20px 16px;
      position: relative;
    }

    /* Inversão para o Jogador Superior */
    .player-top {
      transform: rotate(180deg);
      background: linear-gradient(180deg, rgba(14, 28, 48, 0.6) 0%, rgba(13, 14, 18, 0.9) 100%);
      border-bottom: 1px solid rgba(0, 212, 255, 0.15);
    }

    .player-bottom {
      background: linear-gradient(180deg, rgba(13, 14, 18, 0.9) 0%, rgba(48, 14, 28, 0.6) 100%);
      border-top: 1px solid rgba(255, 75, 75, 0.15);
    }

    /* Divisor Central com Logo */
    .divider {
      height: 48px;
      background: #14161d;
      display: flex;
      align-items: center;
      justify-content: center;
      border-top: 1px solid #252836;
      border-bottom: 1px solid #252836;
      z-index: 10;
      position: relative;
    }

    .logo-container {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: #1e2230;
      border: 2px solid #3b4259;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      box-shadow: 0 0 12px rgba(0, 0, 0, 0.6);
    }

    .app-logo {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* Contador de Dano */
    .damage-display-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      margin: auto 0;
    }

    .damage-number {
      font-size: 5.5rem;
      font-weight: 900;
      line-height: 1;
      text-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
    }

    .player-top .damage-number {
      color: #38ef7d;
    }

    .player-bottom .damage-number {
      color: #ff5252;
    }

    /* Badge Sequencial (+X / -X) */
    .sequence-badge {
      position: absolute;
      top: -24px;
      font-size: 1.2rem;
      font-weight: 800;
      padding: 4px 12px;
      border-radius: 20px;
      opacity: 0;
      transform: translateY(10px) scale(0.8);
      transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      pointer-events: none;
    }

    .sequence-badge.visible {
      opacity: 1;
      transform: translateY(0) scale(1);
    }

    .sequence-badge.plus {
      background: rgba(255, 82, 82, 0.25);
      color: #ff5252;
      border: 1px solid rgba(255, 82, 82, 0.4);
    }

    .sequence-badge.minus {
      background: rgba(56, 239, 125, 0.25);
      color: #38ef7d;
      border: 1px solid rgba(56, 239, 125, 0.4);
    }

    /* Barra de Progresso */
    .progress-bar-bg {
      width: 140px;
      height: 6px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 3px;
      margin-top: 10px;
      overflow: hidden;
    }

    .progress-bar-fill {
      height: 100%;
      width: 0%;
      transition: width 0.2s ease, background 0.2s ease;
    }

    .player-top .progress-bar-fill { background: #38ef7d; }
    .player-bottom .progress-bar-fill { background: #ff5252; }

    /* Botões de Controle */
    .controls {
      display: grid;
      grid-template-columns: 1fr 1.5fr 1.5fr 1fr;
      gap: 10px;
      width: 100%;
      max-width: 360px;
    }

    .btn {
      height: 52px;
      border: none;
      border-radius: 14px;
      font-weight: 800;
      font-size: 1.2rem;
      color: #ffffff;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.08);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.1s, transform 0.1s;
    }

    .btn:active {
      transform: scale(0.94);
      background: rgba(255, 255, 255, 0.15);
    }

    /* Modal de Vitória/Derrota */
    .result-modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(10, 11, 15, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      z-index: 100;
      display: flex;
      flex-direction: column;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .result-modal.active {
      opacity: 1;
      pointer-events: auto;
    }

    .result-half {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .result-top {
      transform: rotate(180deg);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .result-title {
      font-size: 3rem;
      font-weight: 900;
      letter-spacing: 2px;
    }

    .win {
      color: #38ef7d;
      text-shadow: 0 0 25px rgba(56, 239, 125, 0.5);
    }

    .lose {
      color: #ff5252;
      text-shadow: 0 0 25px rgba(255, 82, 82, 0.5);
    }

    .reset-center-btn {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      padding: 14px 28px;
      font-size: 1rem;
      font-weight: 800;
      color: #fff;
      background: #252836;
      border: 2px solid #3b4259;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.8);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .reset-center-btn:active {
      transform: translate(-50%, -50%) scale(0.95);
    }
  </style>
</head>
<body>

  <!-- Jogador 2 (Superior Espelhado) -->
  <div class="player-area player-top">
    <div class="damage-display-container">
      <div class="sequence-badge" id="seq-top">0</div>
      <div class="damage-number" id="damage-top">0</div>
      <div class="progress-bar-bg">
        <div class="progress-bar-fill" id="bar-top"></div>
      </div>
    </div>

    <div class="controls">
      <button class="btn" onclick="addDamage('top', -5)">-5</button>
      <button class="btn" onclick="addDamage('top', -1)">-1</button>
      <button class="btn" onclick="addDamage('top', 1)">+1</button>
      <button class="btn" onclick="addDamage('top', 5)">+5</button>
    </div>
  </div>

  <!-- Divisor Central com Logo -->
  <div class="divider">
    <div class="logo-container">
      <img src="logo.png" alt="GA Logo" class="app-logo" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
      <span style="display:none; font-size: 1.2rem;">🛡️️</span>
    </div>
  </div>

  <!-- Jogador 1 (Inferior) -->
  <div class="player-area player-bottom">
    <div class="damage-display-container">
      <div class="sequence-badge" id="seq-bottom">0</div>
      <div class="damage-number" id="damage-bottom">0</div>
      <div class="progress-bar-bg">
        <div class="progress-bar-fill" id="bar-bottom"></div>
      </div>
    </div>

    <div class="controls">
      <button class="btn" onclick="addDamage('bottom', -5)">-5</button>
      <button class="btn" onclick="addDamage('bottom', -1)">-1</button>
      <button class="btn" onclick="addDamage('bottom', 1)">+1</button>
      <button class="btn" onclick="addDamage('bottom', 5)">+5</button>
    </div>
  </div>

  <!-- Modal Vitória/Derrota -->
  <div class="result-modal" id="resultModal">
    <div class="result-half result-top">
      <div class="result-title" id="res-top-title">GANHOU</div>
    </div>

    <button class="reset-center-btn" onclick="resetGame()">Reiniciar</button>

    <div class="result-half">
      <div class="result-title" id="res-bottom-title">PERDEU</div>
    </div>
  </div>

  <script>
    const MAX_DAMAGE = 25;
    const MIN_DAMAGE = 0;

    let state = {
      top: 0,
      bottom: 0
    };

    let sequenceData = {
      top: { sum: 0, timer: null },
      bottom: { sum: 0, timer: null }
    };

    function addDamage(player, amount) {
      let current = state[player];
      let nextValue = current + amount;

      // Mantém os limites estritos de 0 a 25
      if (nextValue < MIN_DAMAGE) nextValue = MIN_DAMAGE;
      if (nextValue > MAX_DAMAGE) nextValue = MAX_DAMAGE;

      let actualDelta = nextValue - current;
      state[player] = nextValue;

      updateUI(player);
      if (actualDelta !== 0) {
        handleSequence(player, actualDelta);
      }
      checkGameOver();
    }

    function handleSequence(player, delta) {
      let data = sequenceData[player];
      clearTimeout(data.timer);

      data.sum += delta;

      const badge = document.getElementById(`seq-${player}`);
      if (data.sum !== 0) {
        badge.textContent = (data.sum > 0 ? '+' : '') + data.sum;
        badge.className = `sequence-badge visible ${data.sum > 0 ? 'plus' : 'minus'}`;
      } else {
        badge.classList.remove('visible');
      }

      data.timer = setTimeout(() => {
        badge.classList.remove('visible');
        data.sum = 0;
      }, 1500);
    }

    function updateUI(player) {
      const val = state[player];
      document.getElementById(`damage-${player}`).textContent = val;
      const pct = (val / MAX_DAMAGE) * 100;
      document.getElementById(`bar-${player}`).style.width = `${pct}%`;
    }

    function checkGameOver() {
      if (state.top >= MAX_DAMAGE || state.bottom >= MAX_DAMAGE) {
        const modal = document.getElementById('resultModal');
        const topTitle = document.getElementById('res-top-title');
        const bottomTitle = document.getElementById('res-bottom-title');

        if (state.top >= MAX_DAMAGE) {
          topTitle.textContent = "PERDEU";
          topTitle.className = "result-title lose";
          bottomTitle.textContent = "GANHOU";
          bottomTitle.className = "result-title win";
        } else {
          topTitle.textContent = "GANHOU";
          topTitle.className = "result-title win";
          bottomTitle.textContent = "PERDEU";
          bottomTitle.className = "result-title lose";
        }

        modal.classList.add('active');
      }
    }

    function resetGame() {
      state.top = 0;
      state.bottom = 0;
      updateUI('top');
      updateUI('bottom');
      document.getElementById('resultModal').classList.remove('active');
    }

    // Registro do Service Worker para PWA
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(err => console.log('SW Fail:', err));
      });
    }
  </script>
</body>
</html>
