<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#020617">
    
    <!-- Configurações PWA para ocultar barra de status, hora e bateria ao instalar -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="GA Counter">
    <meta name="mobile-web-app-capable" content="yes">
    <title>GA TCG Counter</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
            touch-action: manipulation;
        }
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            background-color: #020617;
            color: #f8fafc;
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            -webkit-user-select: none;
            overflow: hidden;
        }
        .font-cinzel {
            font-family: 'Cinzel', serif;
        }
        .btn-press:active {
            transform: scale(0.93);
        }
        /* Rotaciona a área do oponente para partidas presenciais frente a frente */
        .rotate-opponent {
            transform: rotate(180deg);
        }
        /* Animações de Modal e Badges */
        @keyframes modalPop {
            0% { opacity: 0; transform: scale(0.95); }
            100% { opacity: 1; transform: scale(1); }
        }
        .animate-pop {
            animation: modalPop 0.22s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        @keyframes sequencePop {
            0% { opacity: 0; transform: scale(0.6) translateY(10px); }
            50% { transform: scale(1.1) translateY(0); }
            100% { opacity: 1; transform: scale(1) translateY(0); }
        }
        .animate-seq {
            animation: sequencePop 0.2s ease-out forwards;
        }
        /* Toast notification */
        @keyframes toastFade {
            0% { opacity: 0; transform: translateY(-10px); }
            15% { opacity: 1; transform: translateY(0); }
            85% { opacity: 1; transform: translateY(0); }
            100% { opacity: 0; transform: translateY(-10px); }
        }
        .animate-toast {
            animation: toastFade 3.5s ease-in-out forwards;
        }
        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { 
            -webkit-appearance: none;
            margin: 0;
        }
        input[type=number] {
            appearance: textfield;
        }
    </style>
</head>
<body class="h-screen w-screen flex flex-col justify-between overflow-hidden select-none bg-slate-950 text-slate-100">

    <!-- TOAST NOTIFICATION CONTAINER -->
    <div id="toastContainer" class="fixed top-4 left-1/2 -translate-x-1/2 z-50 pointer-events-none w-11/12 max-w-md"></div>

    <!-- JOGADOR SUPERIOR (OPONENTE / AZUL SAPPHIRE - ROTACIONADO 180) -->

    <!-- JAVASCRIPT LOGIC WITH PROMISE & ERROR HANDLING -->
    <script>
        const MIN_DAMAGE = 0;

        // Recupera valores guardados ou valores padrão
        let p1MaxDamage = parseInt(localStorage.getItem('ga_p1Max')) || 25;
        let p2MaxDamage = parseInt(localStorage.getItem('ga_p2Max')) || 25;

        let p1Damage = parseInt(localStorage.getItem('ga_p1Damage')) || 0;
        let p2Damage = parseInt(localStorage.getItem('ga_p2Damage')) || 0;

        let p1SeqDelta = 0;
        let p2SeqDelta = 0;
        let p1SeqTimer = null;
        let p2SeqTimer = null;

        const p1DamageEl = document.getElementById('p1Damage');
        const p2DamageEl = document.getElementById('p2Damage');
        const p1MaxDisplay = document.getElementById('p1MaxDisplay');
        const p2MaxDisplay = document.getElementById('p2MaxDisplay');
        const p1BarEl = document.getElementById('p1Bar');
        const p2BarEl = document.getElementById('p2Bar');
        const p1BadgeEl = document.getElementById('p1SequenceBadge');
        const p2BadgeEl = document.getElementById('p2SequenceBadge');
        const gameOverModal = document.getElementById('gameOverModal');
        const configModal = document.getElementById('configModal');

        const p1CustomInput = document.getElementById('p1CustomInput');
        const p2CustomInput = document.getElementById('p2CustomInput');
        const p1ModalValDisplay = document.getElementById('p1ModalValDisplay');
        const p2ModalValDisplay = document.getElementById('p2ModalValDisplay');

        // Mostra mensagens amigáveis na tela sem interromper o fluxo
        function showToast(message) {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = 'bg-slate-900/95 border border-amber-500/80 text-amber-200 text-xs text-center px-4 py-3 rounded-2xl shadow-2xl backdrop-blur-md font-semibold mb-2 animate-toast';
            toast.textContent = message;
            container.appendChild(toast);
            setTimeout(() => {
                if (toast.parentNode) toast.parentNode.removeChild(toast);
            }, 3600);
        }

        // --- LÓGICA DE TELA CHEIA TRATADA CONTRA ERROS DE PERMISSÃO ---
        function toggleFullscreen() {
            try {
                const isFS = !!(document.fullscreenElement || document.webkitFullscreenElement || document.mozFullScreenElement || document.msFullscreenElement);
                
                if (!isFS) {
                    const docEl = document.documentElement;
                    let requestPromise = null;

                    if (docEl.requestFullscreen) {
                        requestPromise = docEl.requestFullscreen();
                    } else if (docEl.webkitRequestFullscreen) {
                        requestPromise = docEl.webkitRequestFullscreen();
                    } else if (docEl.mozRequestFullScreen) {
                        requestPromise = docEl.mozRequestFullScreen();
                    } else if (docEl.msRequestFullscreen) {
                        requestPromise = docEl.msRequestFullscreen();
                    }

                    // Se a chamada retornar uma Promise, tratamos com .catch() para evitar UNHANDLEDREJECTION
                    if (requestPromise && typeof requestPromise.catch === 'function') {
                        requestPromise.catch((err) => {
                            console.warn("Fullscreen negado pela política do iFrame/Navegador:", err);
                            showToast("Para tela cheia sem data/bateria no celular, instale o app adicionando à Tela Inicial.");
                        });
                    }
                } else {
                    let exitPromise = null;
                    if (document.exitFullscreen) {
                        exitPromise = document.exitFullscreen();
                    } else if (document.webkitExitFullscreen) {
                        exitPromise = document.webkitExitFullscreen();
                    } else if (document.mozCancelFullScreen) {
                        exitPromise = document.mozCancelFullScreen();
                    } else if (document.msExitFullscreen) {
                        exitPromise = document.msExitFullscreen();
                    }

                    if (exitPromise && typeof exitPromise.catch === 'function') {
                        exitPromise.catch((err) => console.warn("Erro ao sair de tela cheia:", err));
                    }
                }
            } catch (err) {
                console.warn("Exceção capturada ao alternar tela cheia:", err);
                showToast("Dica: Adicione este app à Tela Inicial para ocultar barras de hora e bateria.");
            }
        }

        function updateFullscreenIcons() {
            const isFS = !!(document.fullscreenElement || document.webkitFullscreenElement || document.mozFullScreenElement || document.msFullscreenElement);
            document.getElementById('fsIconExpand').classList.toggle('hidden', isFS);
            document.getElementById('fsIconCompress').classList.toggle('hidden', !isFS);
        }

        document.addEventListener('fullscreenchange', updateFullscreenIcons);
        document.addEventListener('webkitfullscreenchange', updateFullscreenIcons);
        document.addEventListener('mozfullscreenchange', updateFullscreenIcons);
        document.addEventListener('MSFullscreenChange', updateFullscreenIcons);

        // --- LÓGICA DE INTERFACE E CONTADOR ---
        function updateUI() {
            p1DamageEl.textContent = p1Damage;
            p2DamageEl.textContent = p2Damage;

            p1MaxDisplay.textContent = p1MaxDamage;
            p2MaxDisplay.textContent = p2MaxDamage;

            // Porcentagem calculada em relação à vida total do campeão escolhido
            const p1Pct = Math.min(100, (p1Damage / p1MaxDamage) * 100);
            const p2Pct = Math.min(100, (p2Damage / p2MaxDamage) * 100);

            p1BarEl.style.width = `${p1Pct}%`;
            p2BarEl.style.width = `${p2Pct}%`;

            localStorage.setItem('ga_p1Damage', p1Damage);
            localStorage.setItem('ga_p2Damage', p2Damage);
            localStorage.setItem('ga_p1Max', p1MaxDamage);
            localStorage.setItem('ga_p2Max', p2MaxDamage);

            if (p1Damage >= p1MaxDamage || p2Damage >= p2MaxDamage) {
                triggerGameOver();
            }
        }

        function adjustDamage(player, amount) {
            if (player === 1) {
                const previous = p1Damage;
                p1Damage = Math.max(MIN_DAMAGE, Math.min(p1MaxDamage, p1Damage + amount));
                const actualChange = p1Damage - previous;
                if (actualChange !== 0) handleSequenceModifier(1, actualChange);
            } else {
                const previous = p2Damage;
                p2Damage = Math.max(MIN_DAMAGE, Math.min(p2MaxDamage, p2Damage + amount));
                const actualChange = p2Damage - previous;
                if (actualChange !== 0) handleSequenceModifier(2, actualChange);
            }
            updateUI();
        }

        function handleSequenceModifier(player, change) {
            if (player === 1) {
                p1SeqDelta += change;
                clearTimeout(p1SeqTimer);
                showBadge(p1BadgeEl, p1SeqDelta, 'rose');
                p1SeqTimer = setTimeout(() => {
                    hideBadge(p1BadgeEl);
                    p1SeqDelta = 0;
                }, 1500);
            } else {
                p2SeqDelta += change;
                clearTimeout(p2SeqTimer);
                showBadge(p2BadgeEl, p2SeqDelta, 'cyan');
                p2SeqTimer = setTimeout(() => {
                    hideBadge(p2BadgeEl);
                    p2SeqDelta = 0;
                }, 1500);
            }
        }

        function showBadge(badgeEl, value, theme) {
            const text = value > 0 ? `+${value}` : `${value}`;
            badgeEl.textContent = text;
            badgeEl.classList.remove('hidden');

            const baseClass = "absolute -top-2 px-3 py-1 rounded-full text-sm font-black tracking-wider shadow-lg animate-seq border ";
            if (theme === 'cyan') {
                badgeEl.className = baseClass + (value > 0 ? "bg-cyan-950 border-cyan-500 text-cyan-300" : "bg-slate-900 border-slate-600 text-slate-300");
            } else {
                badgeEl.className = baseClass + (value > 0 ? "bg-rose-950 border-rose-500 text-rose-300" : "bg-slate-900 border-slate-600 text-slate-300");
            }
        }

        function hideBadge(badgeEl) {
            badgeEl.classList.add('hidden');
        }

        // --- MODAL CONFIGURADOR DE CAMPEÕES / VIDA MAX ---
        function openConfigModal(targetPlayer = 0) {
            p1CustomInput.value = p1MaxDamage;
            p2CustomInput.value = p2MaxDamage;
            p1ModalValDisplay.textContent = p1MaxDamage;
            p2ModalValDisplay.textContent = p2MaxDamage;

            const p1Section = document.getElementById('p1ConfigSection');
            const p2Section = document.getElementById('p2ConfigSection');

            if (targetPlayer === 1) {
                p1Section.classList.remove('hidden');
                p2Section.classList.add('hidden');
            } else if (targetPlayer === 2) {
                p1Section.classList.add('hidden');
                p2Section.classList.remove('hidden');
            } else {
                p1Section.classList.remove('hidden');
                p2Section.classList.remove('hidden');
            }

            configModal.classList.remove('hidden');
        }

        function closeConfigModal() {
            configModal.classList.add('hidden');
        }

        function setPreset(player, val) {
            if (player === 1) {
                p1CustomInput.value = val;
                p1ModalValDisplay.textContent = val;
            } else {
                p2CustomInput.value = val;
                p2ModalValDisplay.textContent = val;
            }
        }

        p1CustomInput.addEventListener('input', (e) => {
            p1ModalValDisplay.textContent = e.target.value || '?';
        });
        p2CustomInput.addEventListener('input', (e) => {
            p2ModalValDisplay.textContent = e.target.value || '?';
        });

        function saveAndApplyConfig() {
            const val1 = parseInt(p1CustomInput.value);
            const val2 = parseInt(p2CustomInput.value);

            if (val1 && val1 > 0) p1MaxDamage = val1;
            if (val2 && val2 > 0) p2MaxDamage = val2;

            if (p1Damage > p1MaxDamage) p1Damage = p1MaxDamage;
            if (p2Damage > p2MaxDamage) p2Damage = p2MaxDamage;

            closeConfigModal();
            updateUI();
        }

        // --- FIM DE JOGO ---
        function triggerGameOver() {
            const topCard = document.getElementById('topResultCard');
            const topStatus = document.getElementById('topResultStatus');
            const topTitle = document.getElementById('topResultTitle');

            const bottomCard = document.getElementById('bottomResultCard');
            const bottomStatus = document.getElementById('bottomResultStatus');
            const bottomTitle = document.getElementById('bottomResultTitle');

            if (p1Damage >= p1MaxDamage && p2Damage >= p2MaxDamage) {
                setResult(topCard, topStatus, topTitle, 'EMPATE', 'FIM DE JOGO', 'amber');
                setResult(bottomCard, bottomStatus, bottomTitle, 'EMPATE', 'FIM DE JOGO', 'amber');
            } else if (p1Damage >= p1MaxDamage) {
                setResult(bottomCard, bottomStatus, bottomTitle, 'DERROTA', 'PERDEU', 'rose');
                setResult(topCard, topStatus, topTitle, 'VITÓRIA', 'GANHOU', 'emerald');
            } else {
                setResult(topCard, topStatus, topTitle, 'DERROTA', 'PERDEU', 'rose');
                setResult(bottomCard, bottomStatus, bottomTitle, 'VITÓRIA', 'GANHOU', 'emerald');
            }

            gameOverModal.classList.remove('hidden');
        }

        function setResult(card, statusEl, titleEl, statusText, titleText, theme) {
            if (theme === 'emerald') {
                card.className = "bg-emerald-950/80 border-emerald-500/80 text-emerald-200 border rounded-2xl p-5 text-center shadow-xl backdrop-blur-md";
                statusEl.className = "text-xs uppercase tracking-widest font-semibold mb-1 text-emerald-400";
            } else if (theme === 'rose') {
                card.className = "bg-rose-950/80 border-rose-500/80 text-rose-200 border rounded-2xl p-5 text-center shadow-xl backdrop-blur-md";
                statusEl.className = "text-xs uppercase tracking-widest font-semibold mb-1 text-rose-400";
            } else {
                card.className = "bg-amber-950/80 border-amber-500/80 text-amber-200 border rounded-2xl p-5 text-center shadow-xl backdrop-blur-md";
                statusEl.className = "text-xs uppercase tracking-widest font-semibold mb-1 text-amber-400";
            }

            statusEl.textContent = statusText;
            titleEl.textContent = titleText;
        }

        function resetGame() {
            p1Damage = 0;
            p2Damage = 0;
            p1SeqDelta = 0;
            p2SeqDelta = 0;
            clearTimeout(p1SeqTimer);
            clearTimeout(p2SeqTimer);
            hideBadge(p1BadgeEl);
            hideBadge(p2BadgeEl);
            gameOverModal.classList.add('hidden');
            openConfigModal(0);
            updateUI();
        }

        // Evita duplo toque com zoom indesejado no mobile
        document.addEventListener('touchend', function (event) {
            const now = (new Date()).getTime();
            if (now - (window.lastTouchEnd || 0) <= 300) {
                event.preventDefault();
            }
            window.lastTouchEnd = now;
        }, false);

        window.onload = function() {
            updateUI();
        };
    </script>
</body>
</html>
