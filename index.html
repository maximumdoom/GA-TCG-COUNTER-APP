<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#000000">
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="GA Counter">
    <meta name="mobile-web-app-capable" content="yes">
    <title>GA TCG Counter</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&family=MedievalSharp&family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
            touch-action: manipulation;
        }
        html, body {
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            margin: 0;
            padding: 0;
            background-color: #000000;
            color: #f8fafc;
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            -webkit-user-select: none;
            overflow: hidden;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
        }
        .font-cinzel {
            font-family: 'Cinzel', serif;
        }
        .font-medieval {
            font-family: 'MedievalSharp', cursive;
        }
        .btn-press:active {
            transform: scale(0.93);
        }
        @keyframes modalPop {
            0% { opacity: 0; transform: scale(0.95); }
            100% { opacity: 1; transform: scale(1); }
        }
        .animate-pop {
            animation: modalPop 0.22s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        @keyframes sequencePop {
            0% { opacity: 0; transform: scale(0.6) translateY(10px); }
            50% { transform: scale(1.1) translateY(0); }
            100% { opacity: 1; transform: scale(1) translateY(0); }
        }
        .animate-seq {
            animation: sequencePop 0.2s ease-out forwards;
        }
        @keyframes toastFade {
            0% { opacity: 0; transform: translateY(-10px); }
            15% { opacity: 1; transform: translateY(0); }
            85% { opacity: 1; transform: translateY(0); }
            100% { opacity: 0; transform: translateY(-10px); }
        }
        .animate-toast {
            animation: toastFade 3.5s ease-in-out forwards;
        }
        /* Smooth flash transitions */
        .flash-layer {
            transition: background-color 0.4s ease-out;
        }
        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { 
            -webkit-appearance: none;
            margin: 0;
        }
        input[type=number] {
            appearance: textfield;
        }
    </style>
</head>
<body class="h-[100dvh] w-full flex flex-col justify-between overflow-hidden select-none bg-black text-slate-100">

    <div id="toastContainer" class="fixed top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 z-50 pointer-events-none w-11/12 max-w-md"></div>

    <section id="p2Section" class="flex-1 min-h-0 bg-gradient-to-b from-zinc-950 to-black p-2.5 sm:p-4 flex flex-col justify-between relative overflow-hidden rotate-180 pt-[env(safe-area-inset-top,12px)] pb-[env(safe-area-inset-bottom,4px)] cursor-pointer select-none border-b border-zinc-900/50">
        <!-- Smooth tap feedback flash layers (Left = decrease, Right = increase) -->
        <div id="p2FlashLeft" class="flash-layer absolute inset-y-0 left-0 w-1/2 bg-white/0 pointer-events-none"></div>
        <div id="p2FlashRight" class="flash-layer absolute inset-y-0 right-0 w-1/2 bg-white/0 pointer-events-none"></div>

        <div class="flex justify-between items-center z-10 shrink-0">
            <span id="p2Tag" class="text-[10px] sm:text-[11px] font-bold uppercase tracking-widest px-2.5 py-1 rounded-full border border-zinc-800 bg-zinc-900/80 text-zinc-300">
                Player 2
            </span>
            <div class="flex items-center gap-1.5">
                <button id="p2ConfigBtn" onclick="openConfigModal(2)" title="Configurar Player 2" class="btn-press text-[10px] sm:text-[11px] font-semibold px-3 py-1 rounded-full border border-zinc-800 bg-zinc-900/80 text-zinc-300 flex items-center gap-1.5 shadow transition">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-3.5 w-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065Z" />
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0Z" />
                    </svg>
                    <span>Vida Max: <b id="p2MaxDisplay">25</b></span>
                </button>
            </div>
        </div>

        <div class="flex-1 min-h-0 flex flex-col items-center justify-center my-auto z-10 relative pb-6">
            <div id="p2SequenceBadge" class="hidden absolute top-0 px-3 py-0.5 rounded-full text-xs font-black tracking-wider shadow-lg animate-seq border">
                +0
            </div>
            
            <div id="p2Damage" class="text-6xl sm:text-8xl font-black transition-all duration-200 tracking-tight leading-none mb-1 text-slate-100 drop-shadow-md">
                0
            </div>
            
            <div id="p2BarContainer" class="w-full max-w-[220px] sm:max-w-xs bg-zinc-950 h-2 sm:h-2.5 rounded-full mt-1.5 overflow-hidden border border-zinc-800 p-0.5 transition-all">
                <div id="p2Bar" class="bg-gradient-to-r from-zinc-300 to-white h-full rounded-full transition-all duration-300 w-0"></div>
            </div>
        </div>

        <div class="z-10 text-center pb-2 shrink-0 flex justify-between px-4 pointer-events-none">
            <span id="p2TapHintLeft" class="text-[11px] font-semibold text-zinc-400 tracking-wide">− Menos</span>
            <span id="p2TapHintRight" class="text-[11px] font-semibold text-zinc-400 tracking-wide">Mais +</span>
        </div>
    </section>

    <div class="bg-black py-1.5 px-3 flex items-center justify-between border-y border-zinc-900 z-20 gap-2 shrink-0">
        <div class="flex items-center gap-1.5">
            <button onclick="openConfigModal(0)" title="Configurar Partida" class="btn-press bg-zinc-900 hover:bg-zinc-800 border border-zinc-800 text-amber-400 font-semibold text-[11px] px-2.5 py-1.5 rounded-xl flex items-center gap-1 shadow">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-3.5 w-3.5 text-amber-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065Z" />
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0Z" />
                </svg>
                <span class="hidden sm:inline">Config</span>
            </button>

            <button id="fullscreenBtn" onclick="toggleFullscreen()" title="Tela Cheia" class="btn-press bg-zinc-900 hover:bg-zinc-800 border border-zinc-800 text-amber-400 font-semibold text-[11px] px-2.5 py-1.5 rounded-xl flex items-center gap-1 shadow">
                <svg id="fsIconExpand" xmlns="http://www.w3.org/2000/svg" class="h-3.5 w-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 8V4m0 0h4M4 4l5 5m11-5h-4m4 0v4m0-4l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4" />
                </svg>
                <svg id="fsIconCompress" xmlns="http://www.w3.org/2000/svg" class="h-3.5 w-3.5 hidden" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 14l-5 5m0 0h4m-4 0v-4m11 5l5-5m0 0h-4m4 0v-4M9 10L4 5m0 0h4M4 5v4m11-4l5 5m0 0h-4m4 0V5" />
                </svg>
                <span class="hidden sm:inline">Expand</span>
            </button>
        </div>

        <div class="flex items-center gap-1.5 absolute left-1/2 -translate-x-1/2">
            <div class="w-5 h-5 rounded-lg bg-zinc-900 border border-zinc-800 flex items-center justify-center p-0.5 text-amber-400 shadow-inner">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-full h-full drop-shadow" fill="currentColor" viewBox="0 0 24 24">
                    <path d="M5 16L3 5l5.5 5L12 4l3.5 6L21 5l-2 11H5zm14 3c0 .6-.4 1-1 1H6c-.6 0-1-.4-1-1v-1h14v1z"/>
                </svg>
            </div>
            <span class="font-medieval text-xs sm:text-sm font-black tracking-widest bg-gradient-to-r from-amber-300 via-amber-100 to-amber-400 bg-clip-text text-transparent uppercase drop-shadow">GA TCG</span>
        </div>

        <div class="flex items-center">
            <button onclick="resetGame()" class="btn-press bg-zinc-900 hover:bg-zinc-800 border border-zinc-800 text-slate-200 font-semibold text-[11px] uppercase px-2.5 py-1.5 rounded-xl flex items-center gap-1 shadow">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-3.5 w-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
                </svg>
                <span class="hidden sm:inline">Reset</span>
            </button>
        </div>
    </div>

    <section id="p1Section" class="flex-1 min-h-0 bg-gradient-to-b from-black to-zinc-950 p-2.5 sm:p-4 flex flex-col justify-between relative overflow-hidden pt-[env(safe-area-inset-top,4px)] pb-[env(safe-area-inset-bottom,16px)] cursor-pointer select-none">
        <!-- Smooth tap feedback flash layers (Left = decrease, Right = increase) -->
        <div id="p1FlashLeft" class="flash-layer absolute inset-y-0 left-0 w-1/2 bg-white/0 pointer-events-none"></div>
        <div id="p1FlashRight" class="flash-layer absolute inset-y-0 right-0 w-1/2 bg-white/0 pointer-events-none"></div>

        <div class="flex justify-between items-center z-10 shrink-0">
            <span id="p1Tag" class="text-[10px] sm:text-[11px] font-bold uppercase tracking-widest px-2.5 py-1 rounded-full border border-zinc-800 bg-zinc-900/80 text-zinc-300">
                Player 1
            </span>
            <div class="flex items-center gap-1.5">
                <button id="p1ConfigBtn" onclick="openConfigModal(1)" title="Configurar Player 1" class="btn-press text-[10px] sm:text-[11px] font-semibold px-3 py-1 rounded-full border border-zinc-800 bg-zinc-900/80 text-zinc-300 flex items-center gap-1.5 shadow transition">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-3.5 w-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065Z" />
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0Z" />
                    </svg>
                    <span>Vida Max: <b id="p1MaxDisplay">25</b></span>
                </button>
            </div>
        </div>

        <div class="flex-1 min-h-0 flex flex-col items-center justify-center my-auto z-10 relative pb-6">
            <div id="p1SequenceBadge" class="hidden absolute top-0 px-3 py-0.5 rounded-full text-xs font-black tracking-wider shadow-lg animate-seq border">
                +0
            </div>

            <div id="p1Damage" class="text-6xl sm:text-8xl font-black transition-all duration-200 tracking-tight leading-none mb-1 text-slate-100 drop-shadow-md">
                0
            </div>
            
            <div id="p1BarContainer" class="w-full max-w-[220px] sm:max-w-xs bg-zinc-950 h-2 sm:h-2.5 rounded-full mt-1.5 overflow-hidden border border-zinc-800 p-0.5 transition-all">
                <div id="p1Bar" class="bg-gradient-to-r from-zinc-300 to-white h-full rounded-full transition-all duration-300 w-0"></div>
            </div>
        </div>

        <div class="z-10 text-center pb-2 shrink-0 flex justify-between px-4 pointer-events-none">
            <span id="p1TapHintLeft" class="text-[11px] font-semibold text-zinc-400 tracking-wide">− Menos</span>
            <span id="p1TapHintRight" class="text-[11px] font-semibold text-zinc-400 tracking-wide">Mais +</span>
        </div>
    </section>

    <div id="configModal" class="hidden fixed inset-0 bg-black/95 backdrop-blur-md z-50 flex items-center justify-center p-3 animate-pop">
        <div id="configModalWrapper" class="w-full max-w-sm flex items-center justify-center transition-transform duration-300">
            <div id="configModalCard" class="bg-zinc-900 border border-zinc-800 w-full rounded-3xl p-4 sm:p-5 shadow-2xl flex flex-col gap-4 max-h-[90dvh] overflow-y-auto">
                
                <div class="flex justify-between items-center border-b border-zinc-800 pb-2.5">
                    <div>
                        <span id="modalTitle" class="text-amber-400 font-cinzel text-base font-bold block">Configurar Vida Máxima</span>
                        <span class="text-xs text-zinc-400">Escolha o limite de vida da partida</span>
                    </div>
                    <button onclick="closeConfigModal()" title="Fechar" class="text-zinc-400 hover:text-white p-1.5 rounded-lg hover:bg-zinc-800 transition border border-zinc-800">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                        </svg>
                    </button>
                </div>

                <div class="flex flex-col gap-3" id="modalContentInner">
                    <div class="flex items-center justify-between bg-zinc-950 p-3 rounded-2xl border border-zinc-800">
                        <span id="modalPlayerLabel" class="text-xs font-bold uppercase tracking-wider text-zinc-300">Jogador</span>
                        <span class="text-xs text-zinc-400">Vida Max: <b id="modalValDisplay" class="text-amber-400 font-bold">25</b></span>
                    </div>

                    <div class="flex items-center justify-between gap-2 bg-zinc-950 p-3 rounded-xl border border-zinc-800">
                        <span class="text-xs text-zinc-300">Digite o Valor da Vida:</span>
                        <input type="number" id="customLifeInput" min="1" max="999" value="25" class="bg-black border border-zinc-800 text-slate-100 font-bold text-center text-base py-2 px-3 rounded-xl w-28 focus:outline-none">
                    </div>
                </div>

                <div class="flex gap-2 pt-1">
                    <button onclick="saveAndApplyConfig()" class="btn-press flex-1 bg-amber-500 hover:bg-amber-600 text-zinc-950 font-black text-sm py-2.5 rounded-xl uppercase tracking-wider transition shadow-lg">
                        Aplicar
                    </button>
                </div>
            </div>
        </div>
    </div>

    <div id="gameOverModal" class="hidden fixed inset-0 bg-black/95 backdrop-blur-md z-50 flex flex-col justify-between p-6 animate-pop">
        <div class="rotate-180 w-full max-w-sm mx-auto">
            <div id="topResultCard" class="border border-zinc-800 bg-zinc-900 rounded-2xl p-4 text-center shadow-xl">
                <p id="topResultStatus" class="text-xs uppercase tracking-widest font-semibold mb-1 text-zinc-400"></p>
                <p id="topResultTitle" class="text-2xl font-black font-cinzel text-slate-100"></p>
            </div>
        </div>

        <div class="my-auto text-center">
            <button onclick="resetGame()" class="btn-press bg-gradient-to-r from-amber-500 to-amber-600 text-zinc-950 font-black text-sm px-8 py-3.5 rounded-2xl shadow-xl uppercase tracking-wider transition-all">
                Nova Partida
            </button>
        </div>

        <div class="w-full max-w-sm mx-auto">
            <div id="bottomResultCard" class="border border-zinc-800 bg-zinc-900 rounded-2xl p-4 text-center shadow-xl">
                <p id="bottomResultStatus" class="text-xs uppercase tracking-widest font-semibold mb-1 text-zinc-400"></p>
                <p id="bottomResultTitle" class="text-2xl font-black font-cinzel text-slate-100"></p>
            </div>
        </div>
    </div>

    <script>
        const MIN_DAMAGE = 0;

        let activeConfigPlayer = 0; // 0 = general/match, 1 = player 1, 2 = player 2
        let p1MaxDamage = 25;
        let p2MaxDamage = 25;

        let p1Damage = 0;
        let p2Damage = 0;

        let p1SeqDelta = 0;
        let p2SeqDelta = 0;
        let p1SeqTimer = null;
        let p2SeqTimer = null;

        const p1DamageEl = document.getElementById('p1Damage');
        const p2DamageEl = document.getElementById('p2Damage');
        const p1MaxDisplay = document.getElementById('p1MaxDisplay');
        const p2MaxDisplay = document.getElementById('p2MaxDisplay');
        const p1BarEl = document.getElementById('p1Bar');
        const p2BarEl = document.getElementById('p2Bar');
        const p1BadgeEl = document.getElementById('p1SequenceBadge');
        const p2BadgeEl = document.getElementById('p2SequenceBadge');
        const gameOverModal = document.getElementById('gameOverModal');
        const configModal = document.getElementById('configModal');
        const configModalWrapper = document.getElementById('configModalWrapper');
        const customLifeInput = document.getElementById('customLifeInput');
        const modalValDisplay = document.getElementById('modalValDisplay');
        const modalPlayerLabel = document.getElementById('modalPlayerLabel');
        const modalTitle = document.getElementById('modalTitle');

        const p1Section = document.getElementById('p1Section');
        const p2Section = document.getElementById('p2Section');
        const p1FlashLeft = document.getElementById('p1FlashLeft');
        const p1FlashRight = document.getElementById('p1FlashRight');
        const p2FlashLeft = document.getElementById('p2FlashLeft');
        const p2FlashRight = document.getElementById('p2FlashRight');

        if (p1Section) {
            p1Section.addEventListener('click', (e) => {
                if (e.target.closest('button') || e.target.closest('input')) return;
                const rect = p1Section.getBoundingClientRect();
                const x = e.clientX - rect.left;
                if (x < rect.width / 2) {
                    flashSide(p1FlashLeft);
                    adjustDamage(1, -1);
                } else {
                    flashSide(p1FlashRight);
                    adjustDamage(1, 1);
                }
            });
        }

        if (p2Section) {
            p2Section.addEventListener('click', (e) => {
                if (e.target.closest('button') || e.target.closest('input')) return;
                const rect = p2Section.getBoundingClientRect();
                const x = e.clientX - rect.left;
                // Since Player 2's section is rotated 180 degrees on the screen,
                // their visual right side corresponds to clientLeft < rect.width / 2.
                // To make Player 2's physical right side add points and left side reduce points:
                if (x < rect.width / 2) {
                    flashSide(p2FlashRight);
                    adjustDamage(2, 1);
                } else {
                    flashSide(p2FlashLeft);
                    adjustDamage(2, -1);
                }
            });
        }

        function flashSide(flashEl) {
            if (!flashEl) return;
            flashEl.classList.remove('bg-white/0');
            flashEl.classList.add('bg-white/10');
            setTimeout(() => {
                flashEl.classList.remove('bg-white/10');
                flashEl.classList.add('bg-white/0');
            }, 300);
        }

        function showToast(message) {
            const container = document.getElementById('toastContainer');
            if (!container) return;
            const toast = document.createElement('div');
            toast.className = 'bg-zinc-900/95 border border-amber-500/80 text-amber-200 text-xs text-center px-4 py-2.5 rounded-2xl shadow-2xl backdrop-blur-md font-semibold mb-2 animate-toast';
            toast.textContent = message;
            container.appendChild(toast);
            setTimeout(() => {
                if (toast.parentNode) toast.parentNode.removeChild(toast);
            }, 3600);
        }

        function hideBadge(badgeEl) {
            if (!badgeEl) return;
            badgeEl.classList.add('hidden');
        }

        function showBadge(badgeEl, delta) {
            if (!badgeEl) return;
            const text = (delta > 0 ? '+' : '') + delta;
            badgeEl.textContent = text;
            
            if (delta > 0) {
                badgeEl.className = 'absolute top-0 px-3 py-0.5 rounded-full text-xs font-black tracking-wider shadow-lg animate-seq border bg-emerald-950/90 text-emerald-300 border-emerald-500/80';
            } else {
                badgeEl.className = 'absolute top-0 px-3 py-0.5 rounded-full text-xs font-black tracking-wider shadow-lg animate-seq border bg-rose-950/90 text-rose-300 border-rose-500/80';
            }
            badgeEl.classList.remove('hidden');
        }

        function adjustDamage(player, amount) {
            if (player === 1) {
                const newval = Math.max(MIN_DAMAGE, Math.min(p1MaxDamage, p1Damage + amount));
                const actualDelta = newval - p1Damage;
                if (actualDelta === 0 && amount < 0) {
                    showToast("O life não pode ficar abaixo de zero!");
                    return;
                }
                p1Damage = newval;
                p1SeqDelta += actualDelta;
                showBadge(p1BadgeEl, p1SeqDelta);
                clearTimeout(p1SeqTimer);
                p1SeqTimer = setTimeout(() => { p1SeqDelta = 0; hideBadge(p1BadgeEl); }, 1400);
            } else {
                const newval = Math.max(MIN_DAMAGE, Math.min(p2MaxDamage, p2Damage + amount));
                const actualDelta = newval - p2Damage;
                if (actualDelta === 0 && amount < 0) {
                    showToast("O life não pode ficar abaixo de zero!");
                    return;
                }
                p2Damage = newval;
                p2SeqDelta += actualDelta;
                showBadge(p2BadgeEl, p2SeqDelta);
                clearTimeout(p2SeqTimer);
                p2SeqTimer = setTimeout(() => { p2SeqDelta = 0; hideBadge(p2BadgeEl); }, 1400);
            }

            updateUI();

            if (p1Damage >= p1MaxDamage || p2Damage >= p2MaxDamage) {
                triggerGameOver();
            }
        }

        function updateUI() {
            if (p1DamageEl) p1DamageEl.textContent = p1Damage;
            if (p2DamageEl) p2DamageEl.textContent = p2Damage;
            if (p1MaxDisplay) p1MaxDisplay.textContent = p1MaxDamage;
            if (p2MaxDisplay) p2MaxDisplay.textContent = p2MaxDamage;

            const p1Pct = p1MaxDamage > 0 ? Math.min(100, (p1Damage / p1MaxDamage) * 100) : 0;
            const p2Pct = p2MaxDamage > 0 ? Math.min(100, (p2Damage / p2MaxDamage) * 100) : 0;

            if (p1BarEl) p1BarEl.style.width = p1Pct + '%';
            if (p2BarEl) p2BarEl.style.width = p2Pct + '%';
        }

        function toggleFullscreen() {
            try {
                const isFS = !!(document.fullscreenElement || document.webkitFullscreenElement);
                if (!isFS) {
                    const docEl = document.documentElement;
                    if (docEl.requestFullscreen) docEl.requestFullscreen();
                    else if (docEl.webkitRequestFullscreen) docEl.webkitRequestFullscreen();
                } else {
                    if (document.exitFullscreen) document.exitFullscreen();
                    else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
                }
            } catch (err) {
                console.warn("Fullscreen toggle error:", err);
            }
        }

        function updateFullscreenIcons() {
            const isFS = !!(document.fullscreenElement || document.webkitFullscreenElement);
            const fsExpand = document.getElementById('fsIconExpand');
            const fsCompress = document.getElementById('fsIconCompress');
            if (fsExpand) fsExpand.classList.toggle('hidden', isFS);
            if (fsCompress) fsCompress.classList.toggle('hidden', !isFS);
        }

        document.addEventListener('fullscreenchange', updateFullscreenIcons);
        document.addEventListener('webkitfullscreenchange', updateFullscreenIcons);

        function openConfigModal(targetPlayer = 0) {
            activeConfigPlayer = targetPlayer;
            let currentVal = targetPlayer === 1 ? p1MaxDamage : targetPlayer === 2 ? p2MaxDamage : p1MaxDamage;
            
            if (customLifeInput) customLifeInput.value = currentVal;
            if (modalValDisplay) modalValDisplay.textContent = currentVal;

            if (targetPlayer === 1) {
                if (modalPlayerLabel) modalPlayerLabel.textContent = "Player 1";
                if (modalTitle) modalTitle.textContent = "Configurar Vida Máxima";
                if (configModalWrapper) configModalWrapper.className = "w-full max-w-sm flex items-center justify-center transition-transform duration-300 rotate-0";
            } else if (targetPlayer === 2) {
                if (modalPlayerLabel) modalPlayerLabel.textContent = "Player 2";
                if (modalTitle) modalTitle.textContent = "Configurar Vida Máxima";
                if (configModalWrapper) configModalWrapper.className = "w-full max-w-sm flex items-center justify-center transition-transform duration-300 rotate-180";
            } else {
                if (modalPlayerLabel) modalPlayerLabel.textContent = "Partida Geral";
                if (modalTitle) modalTitle.textContent = "Configurar Vida Inicial";
                if (configModalWrapper) configModalWrapper.className = "w-full max-w-sm flex items-center justify-center transition-transform duration-300 rotate-0";
            }

            if (configModal) configModal.classList.remove('hidden');
        }

        function closeConfigModal() {
            if (configModal) configModal.classList.add('hidden');
        }

        if (customLifeInput) {
            customLifeInput.addEventListener('input', (e) => {
                if (modalValDisplay) modalValDisplay.textContent = e.target.value || '?';
            });
        }

        function saveAndApplyConfig() {
            const val = customLifeInput ? parseInt(customLifeInput.value) : 25;
            if (val && val > 0) {
                if (activeConfigPlayer === 1) {
                    p1MaxDamage = val;
                    if (p1Damage > p1MaxDamage) p1Damage = p1MaxDamage;
                } else if (activeConfigPlayer === 2) {
                    p2MaxDamage = val;
                    if (p2Damage > p2MaxDamage) p2Damage = p2MaxDamage;
                } else {
                    p1MaxDamage = val;
                    p2MaxDamage = val;
                    if (p1Damage > p1MaxDamage) p1Damage = p1MaxDamage;
                    if (p2Damage > p2MaxDamage) p2Damage = p2MaxDamage;
                }
            }

            closeConfigModal();
            updateUI();
        }

        function triggerGameOver() {
            const topCard = document.getElementById('topResultCard');
            const topStatus = document.getElementById('topResultStatus');
            const topTitle = document.getElementById('topResultTitle');
            const bottomCard = document.getElementById('bottomResultCard');
            const bottomStatus = document.getElementById('bottomResultStatus');
            const bottomTitle = document.getElementById('bottomResultTitle');

            if (!topCard || !bottomCard) return;

            if (p1Damage >= p1MaxDamage && p2Damage >= p2MaxDamage) {
                setResult(topCard, topStatus, topTitle, "EMPATE", "FIM DE JOGO");
                setResult(bottomCard, bottomStatus, bottomTitle, "EMPATE", "FIM DE JOGO");
            } else if (p1Damage >= p1MaxDamage) {
                setResult(bottomCard, bottomStatus, bottomTitle, "DERROTA", "PERDEU");
                setResult(topCard, topStatus, topTitle, "VITÓRIA", "GANHOU");
            } else {
                setResult(topCard, topStatus, topTitle, "DERROTA", "PERDEU");
                setResult(bottomCard, bottomStatus, bottomTitle, "VITÓRIA", "GANHOU");
            }

            if (gameOverModal) gameOverModal.classList.add('flex');
            if (gameOverModal) gameOverModal.classList.remove('hidden');
        }

        function setResult(card, statusEl, titleEl, statusText, titleText) {
            if (!card || !statusEl || !titleEl) return;
            statusEl.textContent = statusText;
            titleEl.textContent = titleText;
        }

        function resetGame() {
            p1Damage = 0;
            p2Damage = 0;
            p1SeqDelta = 0;
            p2SeqDelta = 0;
            clearTimeout(p1SeqTimer);
            clearTimeout(p2SeqTimer);
            hideBadge(p1BadgeEl);
            hideBadge(p2BadgeEl);
            if (gameOverModal) gameOverModal.classList.add('hidden');
            if (gameOverModal) gameOverModal.classList.remove('flex');
            updateUI();
        }

        document.addEventListener('touchend', function (event) {
            const now = (new Date()).getTime();
            if (now - (window.lastTouchEnd || 0) <= 300) event.preventDefault();
            window.lastTouchEnd = now;
        }, false);

        window.onload = function() {
            updateUI();
        };
    </script>
</body>
</html>
